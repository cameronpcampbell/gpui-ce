[package]
name = "gpui_ce_platform"
version = "0.1.0"
description.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_platform.rs"

[features]
default = []
test-support = ["gpui/test-support", "gpui_macos/test-support"]
screen-capture = [
  "gpui/screen-capture",
  "gpui_macos/screen-capture",
  "gpui_windows/screen-capture",
  "gpui_linux/screen-capture",
]
runtime_shaders = ["gpui_macos/runtime_shaders"]
wayland = ["gpui_linux/wayland"]
x11 = ["gpui_linux/x11"]
wgpu = ["gpui_windows/wgpu"]

[dependencies]
gpui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows.workspace = true
gpui = { workspace = true, features = ["windows-manifest"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_linux.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web.workspace = true
console_error_panic_hook.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_macos = { workspace = true, features = ["test-support"] }

[[test]]
name = "parley_render"
path = "tests/parley_render.rs"
harness = false
